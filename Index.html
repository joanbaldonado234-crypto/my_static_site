<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Personal Website</title>
  
  <!-- Embedded CSS Styles -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      color: #333333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 450px;
      width: 100%;
    }

    h1 {
      color: #0066cc;
      margin-bottom: 15px;
      font-size: 1.8rem;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #555555;
      margin-bottom: 20px;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: #0066cc;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    .btn:hover {
      background-color: #004b99;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Welcome to My Website</h1>
    <p>This static website was created and styled within a single HTML file and deployed directly to GitHub Pages.</p>
    <a href="#" class="btn">Learn More</a>
  </div>

</body>
</html>
